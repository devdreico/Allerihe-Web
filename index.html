    <script>
      try {
        const theme = localStorage.getItem('allerihe-theme');
        const locale = localStorage.getItem('allerihe-locale');
        document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
        document.documentElement.lang = locale === 'en' ? 'en' : 'es';
      } catch {
        document.documentElement.dataset.theme = 'light';
        document.documentElement.lang = 'es';
      }
    </script>
    <title>Allerihe — Conocimiento en movimiento</title>
  </head>

    <div id="root"></div>
